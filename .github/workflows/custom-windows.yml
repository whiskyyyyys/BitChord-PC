name: BitChord x Whis Windows x64
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Package portable app
        shell: pwsh
        run: |
          $dll = Get-ChildItem "$env:USERPROFILE/.cargo/registry/src/*/webview2-com-sys-*/x64/WebView2Loader.dll" | Select-Object -First 1
          if (!$dll) { throw "Missing x64 WebView2Loader.dll" }
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/bitchord.exe, installer/portable.txt, LICENSE, README.md portable
          Copy-Item $dll.FullName portable
      - name: Verify mint W icon embedded in the Windows executable
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $ico = [Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path portable/bitchord.exe).Path)
          $bmp = $ico.ToBitmap()
          $mint = 0
          $dark = 0
          for($x=0;$x -lt $bmp.Width;$x++){for($y=0;$y -lt $bmp.Height;$y++){ $p=$bmp.GetPixel($x,$y); if($p.A -gt 200 -and $p.G -gt 180 -and $p.R -lt 160){$mint++}; if($p.A -gt 200 -and $p.G -lt 120 -and $p.B -gt 35){$dark++} }}
          if($mint -lt 20 -or $dark -lt 5){throw "Embedded W icon check failed"}
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-x-Whis-Windows-x64
          path: portable/
      - name: Create portable ZIP and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "BitChord-x-Whis-Windows-x64.zip"
          Compress-Archive -Path portable/* -DestinationPath $zip -Force
          $tag = "v2.0.1-whis.$env:GITHUB_RUN_NUMBER"
          gh release create $tag $zip `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "BitChord x Whis 2.0.1 (Build $env:GITHUB_RUN_NUMBER)" `
            --notes "Portable Windows x64 build with Whis midnight-blue & mint theme, mint W icon, and Coucou-style top-docked Dynamic Island notch. Extract the ZIP and run **bitchord.exe**."
