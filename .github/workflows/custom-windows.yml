name: WhisMuno Windows Release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Package portable ZIP and Setup .exe
        shell: pwsh
        run: |
          $dll = Get-ChildItem "$env:USERPROFILE/.cargo/registry/src/*/webview2-com-sys-*/x64/WebView2Loader.dll" | Select-Object -First 1
          if (!$dll) { throw "Missing x64 WebView2Loader.dll" }
          Copy-Item $dll.FullName target/release/WebView2Loader.dll
          New-Item -ItemType Directory -Force portable, dist | Out-Null
          Copy-Item target/release/bitchord.exe, installer/portable.txt, LICENSE, README.md portable
          Copy-Item $dll.FullName portable
          Compress-Archive -Path portable/* -DestinationPath dist/WhisMuno-2.0.6-Windows-x64-Portable.zip -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer/bitchord.iss
          Copy-Item installer/Output/bitchord-setup-2.0.6.exe dist/WhisMuno-2.0.6-Windows-x64-Setup.exe
      - name: Verify mint W icon embedded in the Windows executable
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $ico = [Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path portable/bitchord.exe).Path)
          $bmp = $ico.ToBitmap()
          $mint = 0
          $dark = 0
          for($x=0;$x -lt $bmp.Width;$x++){for($y=0;$y -lt $bmp.Height;$y++){ $p=$bmp.GetPixel($x,$y); if($p.A -gt 200 -and $p.G -gt 180 -and $p.R -lt 160){$mint++}; if($p.A -gt 200 -and $p.G -lt 120 -and $p.B -gt 35){$dark++} }}
          if($mint -lt 20 -or $dark -lt 5){throw "Embedded W icon check failed"}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v2.0.6-whis.$env:GITHUB_RUN_NUMBER"
          $notes = @"
          **WhisMuno** (**Whis** **Mu**sic **No**tch) for Windows x64 — DWM-borderless S-curve Dynamic Island notch with real vector icons & mini-capsule tuck mode, plus Spotify-style Side Panel Lyrics + Full Lyrics switching:
          - **Windows x64 Installer**: ``WhisMuno-2.0.6-Windows-x64-Setup.exe``
          - **Windows x64 Portable**: ``WhisMuno-2.0.6-Windows-x64-Portable.zip``
          "@
          gh release create $tag dist/* `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "WhisMuno 2.0.6 (Build $env:GITHUB_RUN_NUMBER)" `
            --notes $notes
