name: WhisMuno Release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Package portable ZIP and Setup .exe
        shell: pwsh
        run: |
          $dll = Get-ChildItem "$env:USERPROFILE/.cargo/registry/src/*/webview2-com-sys-*/x64/WebView2Loader.dll" | Select-Object -First 1
          if (!$dll) { throw "Missing x64 WebView2Loader.dll" }
          Copy-Item $dll.FullName target/release/WebView2Loader.dll
          New-Item -ItemType Directory -Force portable, dist | Out-Null
          Copy-Item target/release/bitchord.exe, installer/portable.txt, LICENSE, README.md portable
          Copy-Item $dll.FullName portable
          Compress-Archive -Path portable/* -DestinationPath dist/WhisMuno-2.0.4-Windows-x64-Portable.zip -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer/bitchord.iss
          Copy-Item installer/Output/bitchord-setup-2.0.4.exe dist/WhisMuno-2.0.4-Windows-x64-Setup.exe
      - name: Verify mint W icon embedded in the Windows executable
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $ico = [Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path portable/bitchord.exe).Path)
          $bmp = $ico.ToBitmap()
          $mint = 0
          $dark = 0
          for($x=0;$x -lt $bmp.Width;$x++){for($y=0;$y -lt $bmp.Height;$y++){ $p=$bmp.GetPixel($x,$y); if($p.A -gt 200 -and $p.G -gt 180 -and $p.R -lt 160){$mint++}; if($p.A -gt 200 -and $p.G -lt 120 -and $p.B -gt 35){$dark++} }}
          if($mint -lt 20 -or $dark -lt 5){throw "Embedded W icon check failed"}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Package macOS .dmg
        run: |
          mkdir -p dist out
          sh macos/bundle.sh target/release/bitchord 2.0.4 out
          hdiutil create -volname "WhisMuno" -srcfolder out/bitchord.app -ov -format UDZO dist/WhisMuno-2.0.4-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release
      - name: Package Linux .tar.gz
        run: |
          mkdir -p stage/bitchord-linux dist
          cp target/release/bitchord stage/bitchord-linux/bitchord
          cp linux/install.sh linux/bitchord.desktop linux/portable.txt LICENSE README.md stage/bitchord-linux/
          cp assets/icon/icon.png stage/bitchord-linux/bitchord.png
          chmod +x stage/bitchord-linux/bitchord stage/bitchord-linux/install.sh
          tar -czf dist/WhisMuno-2.0.4-Linux-x64.tar.gz -C stage bitchord-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist/*

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v2.0.4-whis.${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'EOF'
          **WhisMuno** (**Whis** **Mu**sic **No**tch) cross-platform release with midnight-blue & mint theme, bold W icon, persistent Discord Rich Presence, and smooth Win32-clipped Dynamic Island notch with hide/show tuck bar:
          - **Windows x64 Installer**: `WhisMuno-2.0.4-Windows-x64-Setup.exe`
          - **Windows x64 Portable**: `WhisMuno-2.0.4-Windows-x64-Portable.zip`
          - **macOS**: `WhisMuno-2.0.4-macOS.dmg`
          - **Linux x64**: `WhisMuno-2.0.4-Linux-x64.tar.gz` (run `./install.sh` after extracting)
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WhisMuno 2.0.4 (Build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md
