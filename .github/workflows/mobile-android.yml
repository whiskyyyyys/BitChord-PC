name: Android mobile build

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build installable debug APK
        run: ./gradlew :app:assembleProdDebug -Pbitchord.bundleWear=false
      - uses: actions/upload-artifact@v4
        with:
          name: WhisMuno-Android-debug
          path: mobile/app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
      - name: Publish Android APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/prod/debug/*universal*.apk 2>/dev/null | head -n 1 || ls app/build/outputs/apk/prod/debug/*.apk | head -n 1)
          cp "$apk" WhisMuno-Android-2.0.10.apk
          cp "$apk" WhisMuno-Android-debug.apk
          tag="v2.0.10"
          title="WhisMuno Android 2.0.10 (Build ${GITHUB_RUN_NUMBER})"
          notes="Installable **WhisMuno Android 2.0.10** universal APK (\`WhisMuno-Android-2.0.10.apk\`) with custom cover art for playlists & albums, WhisMuno Mint-Aqua theme, enhanced glowing karaoke lyrics, and clean in-app auto-updater."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" WhisMuno-Android-2.0.10.apk WhisMuno-Android-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$tag" WhisMuno-Android-2.0.10.apk WhisMuno-Android-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
