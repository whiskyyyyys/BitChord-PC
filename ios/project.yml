name: WhisMuno
options:
  bundleIdPrefix: com.whismuno
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "2.0.10"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  WhisMuno:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WhisMuno/Sources
    resources:
      - path: WhisMuno/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whismuno.ios
        PRODUCT_NAME: WhisMuno
        INFOPLIST_FILE: WhisMuno/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
